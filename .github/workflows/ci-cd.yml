name: Robotics DevOps CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: robotics-app

jobs:

  build-test-scan:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        pip install -r app/requirements.txt
        pip install pytest

    - name: Run Unit Tests
      run: |
        pytest app/test_app.py --junitxml=test-results.xml

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      with:
        name: pytest-report
        path: test-results.xml

    - name: OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: "robotics-app"
        path: "."
        format: "HTML"

    - name: Upload OWASP Report
      uses: actions/upload-artifact@v4
      with:
        name: owasp-report
        path: reports

    - name: Build Docker Image
      run: |
        docker build -t robotics-app:latest -f docker/Dockerfile .

    - name: Save Docker Image
      run: |
        docker save robotics-app:latest -o robotics-app.tar

    - name: Upload Docker Artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: robotics-app.tar

    - name: Trivy Image Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: robotics-app:latest
        format: table
        exit-code: 0

    - name: Upload Trivy Report
      uses: actions/upload-artifact@v4
      with:
        name: trivy-report
        path: .